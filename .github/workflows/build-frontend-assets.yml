name: Build and validate frontend assets

on:
  push:
    branches:
      - main
    paths:
      - "resources/css/**"
      - "resources/js/**"
      - "resources/views/**"
      - "app/**/*.php"
      - "routes/**/*.php"
      - "config/**/*.php"
      - "bootstrap/**/*.php"
      - "database/migrations/**"
      - "tests/**"
      - "scripts/**"
      - "phpunit.xml"
      - "vite.config.js"
      - "package.json"
      - "package-lock.json"
      - "composer.json"
      - ".github/workflows/build-frontend-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontend-assets-main
  cancel-in-progress: false

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Lint Laravel PHP source
        run: find app routes config bootstrap database/migrations tests -type f -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Check deployment script syntax
        run: bash -n scripts/sync-abasthan.sh

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Create local test environment file
        run: cp .env.example .env

      - name: Run Laravel feature tests
        env:
          APP_ENV: testing
          APP_DEBUG: "true"
          APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
        run: php artisan test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build Vite assets
        run: npm run build

      - name: Commit built assets for PHP-only hosts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main

            if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
              echo "main moved while the frontend was building; rebuilding from the latest main."
              git reset --hard origin/main
              npm install --no-audit --no-fund
              npm run build
            fi

            git add -f public/build
            if git diff --cached --quiet; then
              echo "Frontend assets are already up to date."
              exit 0
            fi

            git commit -m "Build frontend assets for PHP hosting"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced with another main update; retrying attempt $attempt of 3."
            git fetch origin main
            git reset --hard origin/main
            npm install --no-audit --no-fund
            npm run build
          done

          echo "Unable to push generated assets after three attempts."
          exit 1
